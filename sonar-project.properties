sonar.projectKey=hr-portal
sonar.projectName=HR Portal

sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.test.inclusions=backend/**/tests.py,backend/**/test_*.py,frontend/tests/**/*.ts
sonar.exclusions=**/node_modules/**,**/venv/**,**/*.pyi,**/__pycache__/**,frontend/.next/**,frontend/out/**,backend/media/**
